# Continuous integration (docs/18 §9): static gates, unit + golden + parity + UI tests on software devices.
name: CI
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests tools && .venv/bin/ruff format --check src tests tools
      - run: .venv/bin/mypy
      - run: .venv/bin/lint-imports
      - run: .venv/bin/python tools/check_sizes.py
      - run: .venv/bin/python tools/gen_reference.py --check
      - run: .venv/bin/python tools/update_translations.py --check

  tests:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 mesa-vulkan-drivers libxkbcommon0
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e ".[dev]"
      - name: Warm the kernels
        run: uv run structura warmup
      - name: Unit, parity (pocl / llvmpipe) and UI tests
        run: uv run pytest -q tests -m "not golden"
      - name: Golden compatibility corpus
        if: runner.os == 'Linux'
        run: uv run pytest -q tests -m golden
