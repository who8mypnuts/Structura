# Flatpak manifest: builds Structura from source with its pinned wheels (generate python3-requirements.json
# with flatpak-pip-generator from the lock file before building).
app-id: io.github.structura.Structura
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
command: structura-gui
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri            # OpenGL viewport, Vulkan (wgpu) and OpenCL/CUDA devices
  - --filesystem=home       # scripts, renders and exports live anywhere in the home folder
  - --env=QT_QPA_PLATFORM=wayland;xcb
modules:
  - python3-requirements.json
  - name: structura
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 packaging/linux/structura.desktop /app/share/applications/io.github.structura.Structura.desktop
      - install -Dm644 src/structura/resources/brand/png/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.structura.Structura.png
      - /app/bin/structura warmup
    sources:
      - type: dir
        path: ../..
