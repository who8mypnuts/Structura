# Built-in material presets (docs/10 §3.3). Fields are those of structura.core.scene.material.Material.
# 'base'/'emission' = "state" (the default) take the colour from the EisenScript state; a list fixes it.

[matte]
roughness = 1.0
specular = 0.0

[plastic]
