# Curated knot library (KNOTS_TAB_PLAN Phase 0): the named knots of the future "Knots" dock panel.
#
# A knot is a name plus a list of components; a component is a closed or open bead polyline with a tube
# radius and a colour (rgba = red, green, blue, alpha). Phase 0 fixes this catalogue format and seeds it with
# the first curated knots; the smooth-tube geometry, the big catalogues and the KnotPlot conversion land in
# Phases 1 and 4.

