# Editor snippets (docs/12 §8): every entry of Structure Synth 1.5's editor context menu, with the 'size' → 's'
# fix (docs/01 D2), plus pattern snippets. Shown under Insert ▸ and in completion.

[[snippet]]
group = "Transformations"
items = [
  "x 1 // translations", "y 1", "z 1", "rx 45 // rotate angle around x-axis", "ry 45", "rz 45",
  "hue 0.9", "sat 0.9", "brightness 0.9", "color white // static color", "color random // use color pool",
  "blend red 0.5 // blend color with strength 0.5", "alpha 0.9 // make transparent", "matrix 1 0 0 0 1 0 0 0 1",
  "s 2 // uniform scaling", "s 1 1 1.2 // non-uniform scaling", "reflect 1 0 0", "fx // mirror in yz-plane",
  "fy", "fz",
]

[[snippet]]
group = "Rule Modifiers"
items = ["weight 1", "maxdepth 10", "maxdepth 10 > newRule"]

[[snippet]]
group = "Set Commands"
items = [
  "set maxdepth 100", "set maxobjects 100", "set maxsize 10 // maximum object size",
  "set minsize 0.1 // minimum object size", "set background #fff", "set seed 45",
]

[[snippet]]
group = "Colour"
items = [
  "set colorpool randomrgb", "set colorpool randomhue", "set colorpool list:orange,yellow,blue // sample from list",
  "set colorpool image:test.png // sample from image",
]

[[snippet]]
group = "Advanced Set"
items = [
  "set seed initial // reset random seed", "set recursion depth // traverse depth-first",
  "set rng old // old random generator", "set syncrandom true",
]

[[snippet]]
group = "Camera"
items = [
  "set scale 0.5", "set pivot [0 0 0]", "set translation [0 0 -20]", "set rotation [1 0 0 0 1 0 0 0 1]",
  "set perspective-angle 70",
]

[[snippet]]
group = "Preprocessor"
items = [
  "#define myAngle 45", "#define angle 20 (float:0-90) // create slider with default value 20",
  "#define iterations 20 (int:0-23) // create slider with default value 20",
]

[[snippet]]
group = "Raytracer"
items = [
  "set raytracer::ambient-occlusion-samples 0 // turn off AO", "set raytracer::samples 4 // for anti-alias and DOF",
  "set raytracer::dof [0.4,0.1] // focal-plane distance, strength", "set raytracer::shadows false",
  "set raytracer::reflection 0.5", "set raytracer::phong [0.6,0.6,0.3]", "set raytracer::size [800x600]",
  "set raytracer::size [0x800] // auto-calc proper width", "set raytracer::size [800x0] // auto-calc proper height",
  "set raytracer::light [0,0,-29]", "set raytracer::max-depth 5",
]

[[snippet]]
group = "Patterns"
# Pattern snippets have tab stops (${1:default}; a repeated index is mirrored, $0 is the final cursor).
items = [
  "rule ${1:spiral} {\n  { x ${2:1} rz ${3:20} s ${4:0.95} hue 5 } ${1:spiral}\n  ${5:box}\n}$0",
  "rule ${1:tree} md ${2:12} {\n  { y 1 rz ${3:25} s ${4:0.75} } ${1:tree}\n  { y 1 rz -${3:25} s ${4:0.75} } ${1:tree}\n  { s 0.2 1 0.2 } box\n}$0",
  "${1:10} * { x 1.1 } ${2:10} * { y 1.1 } ${3:box} // a grid$0",
  "rule ${1:menger} md ${2:3} {\n  { s 1/3 x -1 y -1 } ${1:menger}\n  { s 1/3 x 1 y 1 } ${1:menger}\n  box\n}$0",
  "${1:36} * { ry ${2:10} } 1 * { x ${3:5} s 0.5 } ${4:sphere} // a ring$0",
]
