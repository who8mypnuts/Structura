# Gruvbox Light — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "gruvbox-light"
name = "Gruvbox Light"
kind = "light"
family = "Gruvbox"
author = "Pavel Pertsev (palette)"
license = "MIT"
pair = "gruvbox-dark"

[palette]
bg = "#FBF1C7"
bg_alt = "#F2E5BC"
fg = "#3C3836"
comment = "#928374"
accent = "#B57614"
keyword = "#9D0006"
operator = "#AF3A03"
number = "#8F3F71"
color = "#B57614"
primitive = "#427B58"
rule = "#076678"
tag = "#AF3A03"
string = "#79740E"
preproc = "#427B58"
modifier = "#AF3A03"
error = "#9D0006"
warning = "#B57614"
success = "#79740E"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
