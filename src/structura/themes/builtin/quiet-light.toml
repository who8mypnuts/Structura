# Quiet Light — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "quiet-light"
name = "Quiet Light"
kind = "light"
family = "Quiet"
author = "Microsoft VS Code (palette)"
license = "MIT"
pair = "structura-dark"

[palette]
bg = "#F5F5F5"
bg_alt = "#EEEEEE"
fg = "#333333"
comment = "#AAAAAA"
accent = "#4B69C6"
keyword = "#4B69C6"
operator = "#777777"
number = "#9C5D27"
color = "#9C5D27"
primitive = "#7A3E9D"
rule = "#AA3731"
tag = "#448C27"
string = "#448C27"
preproc = "#7A3E9D"
modifier = "#4B69C6"
error = "#E51400"
warning = "#9C5D27"
success = "#448C27"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
