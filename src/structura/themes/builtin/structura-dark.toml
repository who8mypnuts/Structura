# Structura Dark — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "structura-dark"
name = "Structura Dark"
kind = "dark"
family = "Structura"
author = "Structura"
license = "MIT"
pair = "structura-light"

[palette]
bg = "#15181E"
bg_alt = "#1B1F27"
fg = "#D5DAE3"
comment = "#6B7386"
accent = "#22D3EE"
keyword = "#7AA2F7"
operator = "#A9B4C8"
number = "#F0A35E"
color = "#F5C26B"
primitive = "#8B5CF6"
rule = "#38BDF8"
tag = "#EC4899"
string = "#86D993"
preproc = "#A78BFA"
modifier = "#60A5FA"
error = "#F87171"
warning = "#FBBF24"
success = "#4ADE80"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
