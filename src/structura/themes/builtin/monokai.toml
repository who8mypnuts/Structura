fg = "#F8F8F2"
comment = "#88846F"
accent = "#A6E22E"
keyword = "#F92672"
operator = "#F92672"
number = "#AE81FF"
color = "#E6DB74"
primitive = "#66D9EF"
rule = "#A6E22E"
tag = "#FD971F"
string = "#E6DB74"
preproc = "#F92672"
modifier = "#66D9EF"
error = "#F92672"
warning = "#FD971F"
success = "#A6E22E"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
