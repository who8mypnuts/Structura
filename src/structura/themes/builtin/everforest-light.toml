# Everforest Light — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "everforest-light"
name = "Everforest Light"
kind = "light"
family = "Everforest"
author = "sainnhe (palette)"
license = "MIT"
pair = "everforest-dark"

[palette]
bg = "#FDF6E3"
bg_alt = "#F4F0D9"
fg = "#5C6A72"
comment = "#939F91"
accent = "#8DA101"
keyword = "#F85552"
operator = "#F57D26"
number = "#DF69BA"
color = "#DFA000"
primitive = "#35A77C"
rule = "#3A94C5"
tag = "#F57D26"
string = "#8DA101"
preproc = "#DF69BA"
modifier = "#35A77C"
error = "#F85552"
warning = "#DFA000"
success = "#8DA101"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
