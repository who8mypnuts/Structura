# GitHub Dark — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "github-dark"
name = "GitHub Dark"
kind = "dark"
family = "GitHub"
author = "GitHub Primer (palette)"
license = "MIT"
pair = "github-light"

[palette]
bg = "#0D1117"
bg_alt = "#161B22"
fg = "#E6EDF3"
comment = "#8B949E"
accent = "#2F81F7"
keyword = "#FF7B72"
operator = "#79C0FF"
number = "#79C0FF"
color = "#FFA657"
primitive = "#D2A8FF"
rule = "#D2A8FF"
tag = "#7EE787"
string = "#A5D6FF"
preproc = "#FF7B72"
modifier = "#FFA657"
error = "#F85149"
warning = "#D29922"
success = "#3FB950"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
