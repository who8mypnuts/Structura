# Everforest Dark — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "everforest-dark"
name = "Everforest Dark"
kind = "dark"
family = "Everforest"
author = "sainnhe (palette)"
license = "MIT"
pair = "everforest-light"

[palette]
bg = "#2D353B"
bg_alt = "#343F44"
fg = "#D3C6AA"
comment = "#859289"
accent = "#A7C080"
keyword = "#E67E80"
operator = "#E69875"
number = "#D699B6"
color = "#DBBC7F"
primitive = "#83C092"
rule = "#7FBBB3"
tag = "#E69875"
string = "#A7C080"
preproc = "#D699B6"
modifier = "#83C092"
error = "#E67E80"
warning = "#DBBC7F"
success = "#A7C080"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
