# GitHub Light — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "github-light"
name = "GitHub Light"
kind = "light"
family = "GitHub"
author = "GitHub Primer (palette)"
license = "MIT"
pair = "github-dark"

[palette]
bg = "#FFFFFF"
bg_alt = "#F6F8FA"
fg = "#1F2328"
comment = "#6E7781"
accent = "#0969DA"
keyword = "#CF222E"
operator = "#0550AE"
number = "#0550AE"
color = "#953800"
primitive = "#8250DF"
rule = "#8250DF"
tag = "#116329"
string = "#0A3069"
preproc = "#CF222E"
modifier = "#953800"
error = "#CF222E"
warning = "#9A6700"
success = "#1A7F37"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
