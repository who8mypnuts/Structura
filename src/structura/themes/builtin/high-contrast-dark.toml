fg = "#FFFFFF"
comment = "#C8C8C8"
accent = "#FFD400"
keyword = "#6FC3FF"
operator = "#FFFFFF"
number = "#FFB870"
color = "#FFE27A"
primitive = "#D6A8FF"
rule = "#7FF0FF"
