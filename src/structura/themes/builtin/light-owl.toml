# Light Owl — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "light-owl"
name = "Light Owl"
kind = "light"
family = "Night Owl"
author = "Sarah Drasner (palette)"
license = "MIT"
pair = "night-owl"

[palette]
bg = "#FBFBFB"
bg_alt = "#F0F0F0"
fg = "#403F53"
comment = "#989FB1"
accent = "#4876D6"
keyword = "#994CC3"
operator = "#0C969B"
number = "#AA0982"
color = "#C96765"
primitive = "#0C969B"
rule = "#4876D6"
tag = "#E0AF02"
string = "#C96765"
preproc = "#994CC3"
modifier = "#0C969B"
error = "#DE3D3B"
warning = "#E0AF02"
success = "#08916A"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
