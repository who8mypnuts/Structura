# Solarized Dark — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "solarized-dark"
name = "Solarized Dark"
kind = "dark"
family = "Solarized"
author = "Ethan Schoonover (palette)"
license = "MIT"
pair = "solarized-light"

[palette]
bg = "#002B36"
bg_alt = "#073642"
fg = "#93A1A1"
comment = "#657B83"
accent = "#268BD2"
keyword = "#859900"
operator = "#93A1A1"
number = "#D33682"
color = "#B58900"
primitive = "#2AA198"
rule = "#268BD2"
tag = "#CB4B16"
string = "#2AA198"
preproc = "#6C71C4"
modifier = "#859900"
error = "#DC322F"
warning = "#B58900"
success = "#859900"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
