# High Contrast Light — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "high-contrast-light"
name = "High Contrast Light"
kind = "light"
family = "Structura"
author = "Structura"
license = "MIT"
pair = "high-contrast-dark"

[palette]
bg = "#FFFFFF"
bg_alt = "#F4F4F4"
fg = "#000000"
comment = "#3D3D3D"
accent = "#0037DA"
keyword = "#0037DA"
operator = "#000000"
number = "#8A3B00"
color = "#6B4E00"
primitive = "#5B0FA8"
rule = "#00527A"
tag = "#A3004E"
string = "#0B5E0B"
preproc = "#5B0FA8"
modifier = "#0037DA"
error = "#B00000"
warning = "#7A4E00"
success = "#0B5E0B"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
