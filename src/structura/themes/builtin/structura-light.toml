# Structura Light — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "structura-light"
name = "Structura Light"
kind = "light"
family = "Structura"
author = "Structura"
license = "MIT"
pair = "structura-dark"

[palette]
bg = "#FBFCFE"
bg_alt = "#F1F4F9"
fg = "#1E2533"
comment = "#7A8396"
accent = "#0E7490"
keyword = "#1D4ED8"
operator = "#475569"
number = "#B45309"
color = "#A16207"
primitive = "#6D28D9"
rule = "#0369A1"
tag = "#BE185D"
string = "#15803D"
preproc = "#7C3AED"
modifier = "#2563EB"
error = "#DC2626"
warning = "#B45309"
success = "#15803D"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
