# Kanagawa Lotus — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "kanagawa-lotus"
name = "Kanagawa Lotus"
kind = "light"
family = "Kanagawa"
author = "rebelot (palette)"
license = "MIT"
pair = "kanagawa-wave"

[palette]
bg = "#F2ECBC"
bg_alt = "#E5DDB0"
fg = "#545464"
comment = "#8A8980"
accent = "#4D699B"
keyword = "#624C83"
operator = "#836F4A"
number = "#B35B79"
color = "#77713F"
primitive = "#597B75"
rule = "#4D699B"
tag = "#CC6D00"
string = "#6F894E"
preproc = "#C84053"
modifier = "#5E857A"
error = "#C84053"
warning = "#CC6D00"
success = "#6F894E"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
