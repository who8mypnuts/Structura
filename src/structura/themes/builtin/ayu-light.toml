# Ayu Light — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "ayu-light"
name = "Ayu Light"
kind = "light"
family = "Ayu"
author = "Ike Ku (palette)"
license = "MIT"
pair = "ayu-mirage"

[palette]
bg = "#FCFCFC"
bg_alt = "#F3F4F5"
fg = "#5C6166"
comment = "#ADAEB1"
accent = "#FFAA33"
keyword = "#FA8D3E"
operator = "#ED9366"
number = "#A37ACC"
color = "#F2AE49"
primitive = "#55B4D4"
rule = "#F2AE49"
tag = "#F07171"
string = "#86B300"
preproc = "#F07171"
modifier = "#399EE6"
error = "#E65050"
warning = "#F2AE49"
success = "#6CBF43"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
underline = true

[syntax."syntax.comment"]
color = "comment"
italic = true

[syntax."syntax.define"]
color = "preproc"
italic = true

[syntax."syntax.material"]
color = "tag"
italic = true

[syntax."syntax.block"]
color = "keyword"
bold = true
