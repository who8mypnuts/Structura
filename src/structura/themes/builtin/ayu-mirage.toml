# Ayu Mirage — generated by tools/themes/make_builtin.py; edit palettes.toml instead.
[meta]
id = "ayu-mirage"
name = "Ayu Mirage"
kind = "dark"
family = "Ayu"
author = "Ike Ku (palette)"
license = "MIT"
pair = "ayu-light"

[palette]
bg = "#1F2430"
bg_alt = "#1C212B"
fg = "#CCCAC2"
comment = "#6C7A8B"
accent = "#FFCC66"
keyword = "#FFA659"
operator = "#F29E74"
number = "#DFBFFF"
color = "#FFD173"
primitive = "#5CCFE6"
rule = "#FFD173"
tag = "#F28779"
string = "#D5FF80"
preproc = "#F28779"
modifier = "#73D0FF"
error = "#FF6666"
warning = "#FFCC66"
success = "#87D96C"

[roles]
"ui.bg" = "bg"
"ui.bg.alt" = "bg_alt"
"ui.fg" = "fg"
"ui.accent" = "accent"
"editor.bg" = "bg"
"status.error" = "error"
"status.warning" = "warning"
"status.success" = "success"

[syntax]
"syntax.operator" = "operator"
"syntax.number" = "number"
"syntax.color" = "color"
"syntax.rule.ref" = "rule"
"syntax.tag" = "tag"
"syntax.preprocessor" = "preproc"
"syntax.string" = "string"
"syntax.set.key" = "keyword"
"syntax.set.value" = "number"
"syntax.param" = "preproc"

[syntax."syntax.keyword"]
color = "keyword"
bold = true

[syntax."syntax.modifier"]
color = "modifier"
italic = true

[syntax."syntax.primitive"]
color = "primitive"
bold = true

[syntax."syntax.rule.def"]
color = "rule"
bold = true

[syntax."syntax.rule.undefined"]
color = "error"
